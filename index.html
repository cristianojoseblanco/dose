<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dose</title>
<meta name="theme-color" content="#080b24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dose">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#080b24; --ink2:#0f1438; --ink3:#161c4a; --line:rgba(150,160,255,.15); --line2:rgba(150,160,255,.28);
  --txt:#e8eaff; --mut:#9096c8; --dim:#5a6094;
  --mint:#3dffc5; --cyan:#45d2ff; --amber:#ffb547; --pink:#ff4d8d; --lav:#b39bff;
  --r-lg:22px; --r-md:14px; --r-sm:9px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--ink);color:var(--txt);font-family:"Instrument Sans",system-ui,sans-serif;font-size:15px;line-height:1.45}
body{min-height:100vh;background:
  radial-gradient(640px 420px at 100% -10%,rgba(69,210,255,.16),transparent 62%),
  radial-gradient(520px 420px at -20% 40%,rgba(179,155,255,.13),transparent 62%),var(--ink);background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3,.disp{font-family:"Bricolage Grotesque",sans-serif;letter-spacing:-.015em;line-height:1.1}
.app{max-width:470px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 104px)}

/* cabeçalho */
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.brand{font-family:"Bricolage Grotesque";font-weight:800;font-size:22px;letter-spacing:-.03em;display:flex;align-items:center;gap:9px}
.brand .pill{width:26px;height:14px;border-radius:99px;background:linear-gradient(90deg,var(--mint) 50%,var(--lav) 50%);box-shadow:0 0 14px rgba(61,255,197,.55);transform:rotate(-30deg)}
.who{font-size:13px;color:var(--mut);background:none;border:1px solid var(--line);border-radius:99px;padding:6px 12px;cursor:pointer}
.who b{color:var(--txt);font-weight:600}
h1{font-size:34px;font-weight:800;margin-bottom:6px}
h2{font-size:21px;font-weight:700}
.lede{color:var(--mut);font-size:14px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:30px 0 12px;gap:12px}
.sec h3{font-size:17px;font-weight:700}
.sec small{color:var(--mut);font-size:13px}
.link{color:var(--cyan);font-size:13px;font-weight:600;cursor:pointer;background:none;border:0;white-space:nowrap;text-decoration:none}

/* botões */
.btn{font-weight:700;font-size:13px;padding:10px 15px;border-radius:12px;border:1px solid var(--k,var(--mint));color:var(--k,var(--mint));background:transparent;cursor:pointer;white-space:nowrap}
.btn.fill{background:var(--k,var(--mint));color:#06102a;box-shadow:0 0 22px -6px var(--k,var(--mint))}
.btn.quiet{border-color:var(--line2);color:var(--mut)}
.btn.block{width:100%;padding:14px;font-size:15px}
.btn.sm{padding:7px 11px;font-size:12px;border-radius:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* próxima dose (hero) */
.now{padding:20px;border-radius:var(--r-lg);background:linear-gradient(150deg,var(--ink3),var(--ink2));border:1px solid var(--line2);position:relative;overflow:hidden}
.now::before{content:"";position:absolute;inset:auto -60px -80px auto;width:220px;height:220px;border-radius:50%;background:var(--k);opacity:.18;filter:blur(50px)}
.now .when{font-family:"Bricolage Grotesque";font-weight:800;font-size:54px;letter-spacing:-.04em;line-height:1;color:var(--k);text-shadow:0 0 26px color-mix(in srgb,var(--k) 60%,transparent)}
.now .what{font-size:18px;font-weight:600;margin-top:8px}
.now .what span{color:var(--mut);font-weight:400}
.now .late{display:inline-block;margin-top:10px;font-size:13px;font-weight:600;color:var(--pink)}
.now .row{margin-top:16px}

/* cartela */
.foil{border-radius:var(--r-lg);padding:16px 16px 6px;background:
  repeating-linear-gradient(115deg,rgba(255,255,255,.025) 0 2px,transparent 2px 9px),
  linear-gradient(160deg,#1b2154,#11163d);border:1px solid var(--line2)}
.strip{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.strip:last-of-type{border-bottom:0}
.strip .nm{font-size:13px;font-weight:600;line-height:1.25}
.strip .nm small{display:block;color:var(--mut);font-weight:400;font-size:11.5px}
.cells{display:flex;gap:7px;flex-wrap:wrap}
.cap{width:30px;height:16px;border-radius:99px;position:relative;
  background:radial-gradient(ellipse at 35% 30%,rgba(255,255,255,.28),rgba(255,255,255,.04) 70%);border:1px solid rgba(255,255,255,.14)}
.cap.ok{background:var(--k);border-color:transparent;box-shadow:0 0 10px -1px var(--k)}
.cap.ok::after{content:"";position:absolute;left:50%;top:2px;bottom:2px;width:1px;background:rgba(6,16,42,.35)}
.cap.late{background:var(--amber);border-color:transparent;box-shadow:0 0 10px -1px var(--amber)}
.cap.miss{background:transparent;border:1.5px solid var(--pink)}
.cap.miss::after{content:"";position:absolute;left:6px;right:6px;top:50%;height:1.5px;background:var(--pink);transform:rotate(-20deg)}
.cap.due{border:1.5px dashed var(--k)}
.cap.over{border:1.5px solid var(--pink);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(255,77,141,.25)}}
.key{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--mut);padding:10px 0 8px}
.key span{display:inline-flex;align-items:center;gap:6px}
.key .cap{width:18px;height:10px}

/* avisos */
.notes{border-radius:var(--r-lg);border:1px solid var(--line);overflow:hidden;background:rgba(15,20,56,.6)}
.note{display:grid;grid-template-columns:4px 1fr;gap:14px;padding:14px 16px 14px 0;border-bottom:1px solid var(--line)}
.note:last-child{border-bottom:0}
.note i{background:var(--k);box-shadow:0 0 12px var(--k);border-radius:0 4px 4px 0}
.note h4{font-size:14.5px;font-weight:600;line-height:1.35}
.note p{color:var(--mut);font-size:13px;margin-top:4px}
.note .row{margin-top:10px}

/* listas */
.list{border-radius:var(--r-lg);border:1px solid var(--line);background:rgba(15,20,56,.55);overflow:hidden}
.item{display:flex;gap:14px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item.tap{cursor:pointer}
.item .t{font-family:"Bricolage Grotesque";font-weight:700;font-size:18px;width:58px;flex:none;color:var(--k)}
.item .b{flex:1;min-width:0}
.item .b strong{font-weight:600;display:block}
.item .b span{font-size:12.5px;color:var(--mut)}
.item.done{opacity:.5}
.tick{width:40px;height:40px;border-radius:12px;border:1.5px solid var(--k);background:transparent;color:var(--k);cursor:pointer;flex:none;font-size:17px}
.item.done .tick{background:var(--k);color:#06102a}
.chip{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;color:var(--k);background:color-mix(in srgb,var(--k) 14%,transparent);white-space:nowrap}

/* remédio */
.med{padding:18px;border-radius:var(--r-lg);border:1px solid var(--line);background:rgba(15,20,56,.6);margin-bottom:14px}
.med .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;cursor:pointer}
.med h2 span{font-family:"Instrument Sans";font-size:14px;font-weight:500;color:var(--mut)}
.med .sched{font-size:13px;color:var(--mut);margin-top:4px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--k);box-shadow:0 0 10px var(--k);flex:none;margin-top:8px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);margin-top:16px;border-top:1px solid var(--line)}
.facts div{padding:12px 0 2px}
.facts div+div{padding-left:12px;border-left:1px solid var(--line)}
.facts b{display:block;font-family:"Bricolage Grotesque";font-size:20px;font-weight:700}
.facts span{font-size:12px;color:var(--mut)}
.price{margin-top:14px;padding:13px 14px;border-radius:var(--r-md);background:rgba(255,181,71,.07);border:1px solid rgba(255,181,71,.25);font-size:13px}
.price .pr{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.price .pr b{font-variant-numeric:tabular-nums}
.price .pr.est b{color:var(--amber)}
.price small{color:var(--mut);display:block;margin-top:6px;font-size:12px}
.free{margin-top:14px;font-size:13px;color:var(--mut)}
.free b{color:var(--cyan)}
.packs{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-top:8px}
.pk{width:26px;height:8px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;border:1px solid rgba(255,255,255,.1)}
.pk i{display:block;height:100%;background:var(--k);box-shadow:0 0 6px var(--k)}
.packs small{font-size:11.5px;color:var(--mut);margin-left:4px;font-variant-numeric:tabular-nums}
.pkrow{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.pkrow input{width:80px!important}
.pkrow span{color:var(--mut);font-size:13px}
.pkrow .x{margin-left:auto;color:var(--dim);background:none;border:0;font-size:20px;cursor:pointer}

/* retiradas */
.pick{padding:18px;border-radius:var(--r-lg);border:1px solid var(--line2);background:linear-gradient(170deg,var(--ink3),var(--ink2));margin-bottom:16px}
.place{margin-top:10px;font-size:13px;color:var(--mut);line-height:1.5}
.place b{color:var(--txt);font-weight:600}
.track{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:18px 0 6px}
.track div{font-size:12px;color:var(--dim)}
.track div::before{content:"";display:block;height:4px;border-radius:9px;background:rgba(255,255,255,.08);margin-bottom:7px}
.track div.on{color:var(--txt)}
.track div.on::before{background:var(--k);box-shadow:0 0 10px var(--k)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:var(--r-md);overflow:hidden;margin-top:14px}
.grid2 div{background:var(--ink2);padding:11px 12px}
.grid2 span{display:block;font-size:12px;color:var(--mut)}
.grid2 b{display:block;font-size:14px;font-weight:600;margin-top:2px}
.grp{margin-top:22px}
.grp h4{font-family:"Bricolage Grotesque";font-size:15px;font-weight:700;margin-bottom:6px}
.grp p.help{font-size:12.5px;color:var(--mut);margin-bottom:6px}
.chk{display:flex;gap:11px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;cursor:pointer}
.chk:last-child{border-bottom:0}
.bx{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--k,var(--mint));flex:none;margin-top:1px;display:grid;place-items:center}
.chk.on .bx{background:var(--k,var(--mint))}
.chk.on .bx::after{content:"";width:5px;height:10px;border:solid #06102a;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.chk.on span{color:var(--mut);text-decoration:line-through}
.chk .x{margin-left:auto;color:var(--dim);background:none;border:0;font-size:18px;cursor:pointer;line-height:1;padding:0 4px}
.addline{display:flex;gap:8px;margin-top:8px}
.addline input{flex:1;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.04);outline:none;font-size:14px}
.box{padding:13px 14px;border-radius:var(--r-md);border:1px solid var(--line);background:rgba(255,255,255,.025);font-size:13.5px;line-height:1.5}
.box.k{border-color:color-mix(in srgb,var(--k) 40%,transparent);background:color-mix(in srgb,var(--k) 8%,transparent)}
.box ul{margin:8px 0 0 18px}
.box li{margin:4px 0}
.box small{color:var(--dim);display:block;margin-top:6px;font-size:12px}

/* segment */
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:76px;padding:10px 8px;border-radius:12px;border:1px solid var(--line2);background:transparent;color:var(--mut);font-size:13px;cursor:pointer}
.seg .tabb{min-width:0;line-height:1.2}.seg .tabb b{display:block;font-family:'Bricolage Grotesque';font-size:18px;margin-top:2px}
.seg button.on{border-color:var(--k,var(--cyan));color:var(--txt);background:color-mix(in srgb,var(--k,var(--cyan)) 18%,transparent)}

/* consultas */
.appt .t{text-align:center;line-height:1}
.appt .t small{display:block;font-family:"Instrument Sans";font-size:11px;color:var(--mut);font-weight:500;margin-top:3px}

/* histórico */
.score{display:flex;align-items:baseline;gap:10px}
.score b{font-family:"Bricolage Grotesque";font-size:46px;font-weight:800;color:var(--mint);letter-spacing:-.04em;text-shadow:0 0 22px rgba(61,255,197,.4)}
.split{display:flex;height:8px;border-radius:99px;overflow:hidden;margin:14px 0 8px;background:rgba(255,255,255,.06)}
.split i{display:block;height:100%}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--mut)}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--k);margin-right:6px}
.cal{display:grid;grid-template-columns:repeat(14,1fr);gap:5px;margin-top:16px}
.cal i{aspect-ratio:1;border-radius:4px;background:rgba(255,255,255,.06)}
.cal i.ok{background:var(--mint)}.cal i.late{background:var(--amber)}.cal i.miss{background:var(--pink)}
.empty{text-align:center;color:var(--mut);font-size:14px;padding:26px 16px;border:1px dashed var(--line2);border-radius:var(--r-lg)}
.fine{font-size:12px;color:var(--dim);margin-top:26px;line-height:1.55}

/* nav */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 12px);width:min(450px,calc(100% - 24px));
  display:flex;padding:7px;border-radius:22px;background:rgba(10,14,44,.9);border:1px solid var(--line2);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 12px 40px rgba(0,0,0,.55);z-index:20}
.nav button{flex:1;background:none;border:0;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;padding:6px 2px;cursor:pointer;border-radius:14px}
.nav svg{width:22px;height:22px}
.nav button.on{color:var(--txt);background:rgba(69,210,255,.08)}
.nav button.on svg{color:var(--cyan)}

/* folha */
.scrim{position:fixed;inset:0;background:rgba(3,5,18,.72);backdrop-filter:blur(3px);z-index:40;display:none}
.scrim.on{display:block}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:min(470px,100%);max-height:90vh;overflow-y:auto;z-index:50;
  background:#0c1033;border:1px solid var(--line2);border-bottom:0;border-radius:24px 24px 0 0;padding:10px 20px calc(env(safe-area-inset-bottom) + 22px);transition:transform .26s cubic-bezier(.2,.9,.3,1)}
.sheet.on{transform:translate(-50%,0)}
.grab{width:40px;height:4px;border-radius:9px;background:var(--dim);margin:4px auto 16px}
.sheet h2{margin-bottom:16px}
.fld{margin-bottom:13px}
.fld label{display:block;font-size:13px;color:var(--mut);margin-bottom:6px;font-weight:500}
.fld input,.fld select,.fld textarea{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line2);background:rgba(255,255,255,.04);font-size:15px;outline:none;color-scheme:dark}
.fld textarea{min-height:64px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--cyan)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:13px;color:var(--mut);padding:12px 14px;border-radius:12px;border:1px dashed var(--line2);margin-bottom:14px;line-height:1.5}
.hint b{color:var(--mint)}
.tgrow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;font-size:14px;gap:12px}
.tg{width:44px;height:26px;border-radius:99px;background:rgba(255,255,255,.12);position:relative;cursor:pointer;border:0;flex:none}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.tg.on{background:var(--mint)}
.tg.on::after{left:21px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 16px);transform:translate(-50%,-140px);z-index:60;padding:11px 16px;border-radius:14px;background:#141a4a;border:1px solid var(--line2);font-size:14px;transition:.3s;max-width:90%}
.toast.on{transform:translate(-50%,0)}
/* ===== camada viva: sombra + brilho na base ===== */
body::before{content:"";position:fixed;inset:-20%;pointer-events:none;z-index:0;
  background:radial-gradient(28% 22% at 20% 30%,rgba(61,255,197,.10),transparent 70%),radial-gradient(30% 24% at 80% 70%,rgba(179,155,255,.12),transparent 70%),radial-gradient(24% 20% at 60% 10%,rgba(69,210,255,.10),transparent 70%);
  animation:drift 26s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(4%,-3%) rotate(6deg)}}
.now,.foil,.notes,.list,.med,.pick,.price,.box.k{
  --gl:color-mix(in srgb,var(--k,var(--cyan)) 30%,transparent);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 26px 50px -28px rgba(0,0,0,.9),0 14px 34px -18px var(--gl);
}
.med,.pick,.list,.notes{background:radial-gradient(90% 55% at 50% 118%,var(--gl),transparent 70%),linear-gradient(170deg,#141a49,#0d1238)}
.foil{background:radial-gradient(90% 60% at 50% 120%,var(--gl),transparent 70%),repeating-linear-gradient(115deg,rgba(255,255,255,.025) 0 2px,transparent 2px 9px),linear-gradient(160deg,#1d2358,#11163d)}
.now{background:radial-gradient(100% 70% at 50% 125%,color-mix(in srgb,var(--k) 42%,transparent),transparent 70%),linear-gradient(150deg,#1a2056,#0f1438)}
.price{background:radial-gradient(90% 70% at 50% 130%,rgba(255,181,71,.22),transparent 70%),rgba(255,181,71,.05)}
.btn.fill{box-shadow:0 8px 22px -8px var(--k,var(--mint)),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .12s}
.btn:active,.tick:active,.item.tap:active,.med .top:active{transform:scale(.97)}
.item{transition:background .2s}
.item.tap:hover{background:rgba(255,255,255,.025)}

/* anel do dia */
.now:has(.ring) .lede,.now:has(.ring) .when{padding-right:88px}
.ring{position:absolute;right:18px;top:18px;width:74px;height:74px}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7}
.ring .bg{stroke:rgba(255,255,255,.08)}
.ring .fg{stroke:var(--k);stroke-linecap:round;filter:drop-shadow(0 0 6px var(--k));transition:stroke-dashoffset .8s cubic-bezier(.2,.9,.3,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:"Bricolage Grotesque";font-size:17px;font-weight:800}
.ring small{position:absolute;left:0;right:0;bottom:-18px;text-align:center;font-size:11px;color:var(--mut)}

/* ranking de urgência */
.rank{display:grid;grid-template-columns:44px 1fr;gap:12px;padding:15px 16px 15px 12px;border-bottom:1px solid var(--line);position:relative}
.rank:last-child{border-bottom:0}
.rank .pos{display:flex;flex-direction:column;align-items:center;gap:6px}
.rank .pos b{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;font-family:"Bricolage Grotesque";font-weight:800;font-size:16px;color:#06102a;background:var(--k);box-shadow:0 0 18px -3px var(--k)}
.rank .pos i{flex:1;width:3px;border-radius:9px;background:linear-gradient(var(--k),transparent);opacity:.5;min-height:10px}
.rank .lvl{font-size:12px;font-weight:700;color:var(--k)}
.rank h4{font-size:15px;font-weight:600;line-height:1.35;margin-top:2px}
.rank p{color:var(--mut);font-size:13px;margin-top:4px}
.rank .row{margin-top:10px}
.heat{display:flex;height:6px;border-radius:99px;overflow:hidden;margin:2px 0 12px;gap:2px}
.heat i{flex:1}

/* celebração */
.fx{position:fixed;width:16px;height:8px;border-radius:99px;background:var(--c);box-shadow:0 0 10px var(--c);z-index:80;pointer-events:none;
  animation:fly var(--t,900ms) cubic-bezier(.12,.8,.3,1) forwards}
@keyframes fly{0%{transform:translate(0,0) rotate(0) scale(.6);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(1);opacity:0}}
.party{position:fixed;inset:0;z-index:75;display:grid;place-items:center;pointer-events:none}
.party .card{padding:26px 30px;border-radius:26px;text-align:center;background:radial-gradient(100% 80% at 50% 120%,rgba(61,255,197,.4),transparent 70%),#121a4a;border:1px solid rgba(61,255,197,.5);
  box-shadow:0 30px 80px -20px rgba(0,0,0,.9),0 0 60px -10px rgba(61,255,197,.5);animation:pop 2.6s cubic-bezier(.2,1.4,.4,1) forwards}
.party .card b{display:block;font-family:"Bricolage Grotesque";font-size:30px;font-weight:800;letter-spacing:-.03em}
.party .card span{color:var(--mut);font-size:14px}
@keyframes pop{0%{transform:scale(.6);opacity:0}12%{transform:scale(1);opacity:1}80%{transform:scale(1);opacity:1}100%{transform:scale(.95);opacity:0}}
.item.just{animation:flash .9s ease}
@keyframes flash{0%{background:color-mix(in srgb,var(--k) 30%,transparent)}100%{background:transparent}}
/* ===== profundidade 3D ===== */
.head{position:sticky;top:0;z-index:15;margin:-18px -18px 20px;padding:calc(env(safe-area-inset-top) + 12px) 18px 12px;transition:background .3s,box-shadow .3s}
.head.scrolled{background:rgba(8,11,36,.72);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 12px 30px -14px rgba(0,0,0,.8),inset 0 -1px 0 var(--line)}
.brand .pill{transition:transform .2s linear}
.now,.foil,.notes,.list,.med,.pick{
  border-top-color:rgba(255,255,255,.2)!important;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.14), inset 0 -3px 6px rgba(0,0,0,.35),
    0 1px 0 #232b78, 0 3px 0 #1a2163, 0 5px 0 #141a52, 0 7px 0 #0f1443, 0 9px 0 #0a0e33, 0 10px 1px #06081f,
    0 26px 34px -10px rgba(0,0,0,.9), 0 50px 70px -30px rgba(0,0,0,.7),
    0 50px 70px -36px var(--gl);
  margin-bottom:24px;
  transform:perspective(1100px) translateY(var(--py,0px)) rotateX(var(--tx,0deg)) rotateY(var(--ty,0deg)) translateZ(var(--tz,0px));
  transform-origin:50% 50%;will-change:transform}
.press{--py:5px;box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 1px 0 #141a52,0 2px 0 #080b2c,0 10px 16px -8px rgba(0,0,0,.8),0 24px 40px -30px var(--gl)!important}
.live{transition:transform .2s ease-out,box-shadow .15s}
.rv:is(.now,.foil,.notes,.list,.med,.pick):not(.in){opacity:0;transform:perspective(900px) translateY(60px) rotateX(28deg) scale(.94)}
.rv:is(.now,.foil,.notes,.list,.med,.pick){transition:opacity .7s ease,transform .8s cubic-bezier(.16,.9,.24,1)}
.foil.anim .cap{animation:capin .55s cubic-bezier(.2,1.7,.4,1) backwards;animation-delay:calc(var(--i,0)*55ms + 250ms)}
@keyframes capin{from{transform:scale(0) rotate(-50deg);opacity:0}}
.notes.anim .rank{animation:rkin .7s cubic-bezier(.16,.9,.24,1) backwards;animation-delay:calc(var(--i,0)*110ms + 200ms)}
.notes.anim .rank .pos b{animation:capin .6s cubic-bezier(.2,1.7,.4,1) backwards;animation-delay:calc(var(--i,0)*110ms + 320ms)}
@keyframes rkin{from{opacity:0;transform:translateX(-30px)}}
.heat i{transform-origin:left}
.heat.anim i{animation:grow 1s cubic-bezier(.16,.9,.24,1) backwards;animation-delay:calc(var(--i,0)*140ms)}
@keyframes grow{from{transform:scaleX(0)}}
.packs.anim .pk i{animation:fill 1.1s cubic-bezier(.16,.9,.24,1) backwards;animation-delay:calc(var(--i,0)*70ms + 200ms)}
@keyframes fill{from{width:0}}
.now.anim .ring .fg{animation:ringin 1.4s cubic-bezier(.16,.9,.24,1) .35s backwards}
@keyframes ringin{from{stroke-dashoffset:188.5}}
.grid2.anim div{animation:rkin .6s cubic-bezier(.16,.9,.24,1) backwards}
.grid2.anim div:nth-child(2){animation-delay:.08s}.grid2.anim div:nth-child(3){animation-delay:.16s}.grid2.anim div:nth-child(4){animation-delay:.24s}.grid2.anim div:nth-child(5){animation-delay:.32s}.grid2.anim div:nth-child(6){animation-delay:.4s}

/* cartela de bolhas */
.foil.blister{--sheen:40%;display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:18px 8px;padding:22px 14px 18px;border:1px solid rgba(255,255,255,.22);
  background:
    linear-gradient(115deg,transparent calc(var(--sheen) - 18%),rgba(255,255,255,.2) var(--sheen),transparent calc(var(--sheen) + 18%)),
    conic-gradient(from 210deg at 25% 15%,rgba(61,255,197,.22),rgba(69,210,255,.18),rgba(179,155,255,.24),rgba(255,77,141,.16),rgba(61,255,197,.22)),
    repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,transparent 1px 4px),
    linear-gradient(160deg,#3b4396,#1e2466 55%,#151b52)}
.foil.blister::before{content:"";position:absolute;inset:8px;border:1px dashed rgba(255,255,255,.16);border-radius:18px;pointer-events:none}
.bub{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;color:var(--txt);padding:0;position:relative;font:inherit}
.dome{width:62px;height:62px;border-radius:50%;position:relative;display:grid;place-items:center;transition:transform .15s;
  background:radial-gradient(circle at 34% 26%,rgba(255,255,255,.85) 0 5%,rgba(255,255,255,.25) 16%,rgba(255,255,255,.06) 42%,rgba(10,14,50,.25) 72%,rgba(255,255,255,.16) 100%);
  box-shadow:0 10px 14px -6px rgba(0,0,0,.7),0 0 0 3px rgba(255,255,255,.07),inset 0 -7px 10px rgba(0,0,0,.4),inset 0 4px 8px rgba(255,255,255,.3),0 0 26px -6px var(--k)}
.bub:active .dome{transform:scale(.86,.8)}
.pil{width:38px;height:17px;border-radius:99px;background:linear-gradient(90deg,var(--k) 50%,#eef0ff 50%);transform:rotate(-35deg);
  box-shadow:inset 0 -3px 5px rgba(0,0,0,.35),inset 0 2px 3px rgba(255,255,255,.65),0 0 14px -2px var(--k)}
.pil.inj{width:42px;height:12px;background:linear-gradient(90deg,#eef0ff 0 18%,var(--k) 18% 82%,#c9cfee 82%)}
.lb{font-size:11.5px;color:var(--mut);text-align:center;line-height:1.25;max-width:84px}
.lb b{display:block;font-family:"Bricolage Grotesque";font-size:16px;font-weight:800;color:var(--txt)}
.lb em{display:block;font-style:normal;font-size:10.5px;color:var(--mint);margin-top:2px}
.lb em.lt{color:var(--pink)}
.bub.late .dome{animation:latepulse 1.5s ease-in-out infinite}
@keyframes latepulse{50%{box-shadow:0 10px 14px -6px rgba(0,0,0,.7),0 0 0 7px rgba(255,77,141,.35),inset 0 -7px 10px rgba(0,0,0,.4),inset 0 4px 8px rgba(255,255,255,.3),0 0 30px -4px #ff4d8d}}
.bub.late .lb b{color:var(--pink)}
.bub.later .dome{filter:saturate(.75) brightness(.9)}
.bub.taken .dome{background:radial-gradient(circle,#05071c 0 47%,rgba(160,170,230,.35) 49%,transparent 62%);box-shadow:inset 0 5px 12px rgba(0,0,0,.85),0 0 0 3px rgba(255,255,255,.05)}
.bub.taken .dome::before{content:"";position:absolute;inset:7px;border-radius:50%;
  background:conic-gradient(rgba(225,232,255,.7) 0 6%,transparent 6% 11%,rgba(225,232,255,.55) 11% 19%,transparent 19% 24%,rgba(225,232,255,.65) 24% 33%,transparent 33% 41%,rgba(225,232,255,.5) 41% 52%,transparent 52% 58%,rgba(225,232,255,.6) 58% 70%,transparent 70% 76%,rgba(225,232,255,.55) 76% 88%,transparent 88% 93%,rgba(225,232,255,.6) 93%);
  -webkit-mask:radial-gradient(circle,transparent 0 58%,#000 60% 76%,transparent 78%);mask:radial-gradient(circle,transparent 0 58%,#000 60% 76%,transparent 78%)}
.bub.taken .dome::after{content:"✓";position:absolute;font-size:18px;font-weight:800;color:var(--k);text-shadow:0 0 10px var(--k)}
.bub.taken .pil{display:none}
.bub.pop .pil{animation:popout .55s cubic-bezier(.3,.7,.4,1) forwards}
@keyframes popout{30%{transform:translateY(-14px) rotate(-10deg) scale(1.15)}100%{transform:translateY(-130px) rotate(300deg) scale(1.3);opacity:0}}
.bub.pop .dome{animation:crush .4s ease forwards}
@keyframes crush{40%{transform:scale(.8,.66)}100%{transform:scale(.96)}}
.foil.blister.anim .bub{animation:capin .55s cubic-bezier(.2,1.6,.4,1) backwards}
.foil.blister.anim .bub:nth-child(2){animation-delay:.07s}.foil.blister.anim .bub:nth-child(3){animation-delay:.14s}.foil.blister.anim .bub:nth-child(4){animation-delay:.21s}.foil.blister.anim .bub:nth-child(5){animation-delay:.28s}.foil.blister.anim .bub:nth-child(n+6){animation-delay:.35s}
/* kits rápidos: vitrine 3D */
.kits{display:flex;align-items:flex-start;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:8px 18px 34px;margin:0 -18px;scrollbar-width:none;perspective:1000px}
.kits::-webkit-scrollbar{display:none}
.kit{flex:0 0 80%;scroll-snap-align:center;border-radius:24px;padding:18px;position:relative;
  --gl:color-mix(in srgb,var(--k) 38%,transparent);
  background:radial-gradient(90% 60% at 50% 120%,var(--gl),transparent 70%),radial-gradient(60% 50% at 0% 0%,color-mix(in srgb,var(--k) 18%,transparent),transparent 70%),linear-gradient(165deg,#1a2158,#0e1339);
  border:1px solid rgba(255,255,255,.18);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 1px 0 #232b78,0 3px 0 #1a2163,0 5px 0 #141a52,0 7px 0 #0d1240,0 22px 30px -10px rgba(0,0,0,.9),0 40px 60px -30px var(--gl);
  transform:rotateY(var(--ry,0deg)) scale(var(--sc,1));opacity:var(--op,1);transition:transform .12s linear,opacity .12s linear;transform-style:preserve-3d}
.kit-top{display:flex;gap:12px;align-items:center}
.kit-ic{width:52px;height:52px;flex:none;border-radius:16px;display:grid;place-items:center;font-size:28px;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.35),transparent 60%),color-mix(in srgb,var(--k) 30%,#0e1339);
  box-shadow:inset 0 -4px 8px rgba(0,0,0,.35),0 8px 18px -6px var(--k);animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{translate:0 -4px}}
.kit h4{font-family:"Bricolage Grotesque";font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.kit p{color:var(--mut);font-size:12.5px;margin-top:3px}
.kit-lbl{font-size:12px;font-weight:600;color:var(--k);margin:14px 0 7px}
.kit-chips{display:flex;flex-wrap:wrap;gap:6px}
.kchip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:6px 10px;border-radius:99px;border:1px solid var(--line2);background:rgba(255,255,255,.05);color:var(--txt);cursor:pointer;text-decoration:none}
.kchip i{width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.kchip.buy{border-color:color-mix(in srgb,var(--k) 45%,transparent);background:color-mix(in srgb,var(--k) 12%,transparent)}
.kchip.buy::after{content:"";width:6px;height:6px;border-top:1.5px solid currentColor;border-right:1.5px solid currentColor;transform:rotate(45deg);opacity:.6;margin-left:2px}
.kit-note{margin-top:12px!important;font-size:11.5px!important;color:var(--dim)!important;line-height:1.45}
.kit-store{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:14px 0 8px}
.kseg{display:flex;padding:3px;border-radius:99px;background:rgba(0,0,0,.3);box-shadow:inset 0 2px 5px rgba(0,0,0,.5)}
.kseg button{border:0;background:none;color:var(--mut);font:inherit;font-size:12px;font-weight:700;padding:6px 11px;border-radius:99px;cursor:pointer;transition:background .2s,color .2s}
.kseg button.on{background:var(--s);color:#fff;box-shadow:0 4px 12px -3px var(--s)}
/* simulador de viagem */
.sim{padding:16px;border-radius:18px;background:radial-gradient(90% 70% at 50% 120%,rgba(69,210,255,.18),transparent 70%),rgba(0,0,0,.18);border:1px solid var(--line2);box-shadow:inset 0 2px 8px rgba(0,0,0,.35)}
.sim .from{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.sim .from button{flex:1 1 0;min-width:0;overflow:hidden;text-overflow:ellipsis}
.sim .from .loc{flex-basis:100%}
.sim input{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line2);background:rgba(255,255,255,.05);color:var(--txt);font:inherit;font-size:14px;outline:none;color-scheme:dark}
.sim .two{margin-top:8px}
.route{position:relative;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;margin:26px 0 16px}
.route .pt{text-align:center;font-size:12px;font-weight:600;max-width:86px;line-height:1.2}
.route .pt i{display:block;width:14px;height:14px;border-radius:50%;margin:0 auto 6px;background:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 25%,transparent),0 0 14px var(--c)}
.route .line{position:relative;height:4px;border-radius:9px;background:repeating-linear-gradient(90deg,rgba(69,210,255,.8) 0 8px,transparent 8px 14px);background-size:28px 4px;animation:dash 1.1s linear infinite}
@keyframes dash{to{background-position:28px 0}}
.route .line i{position:absolute;top:50%;width:28px;height:13px;border-radius:99px;background:linear-gradient(90deg,var(--mint) 50%,var(--lav) 50%);transform:translate(-50%,-50%) rotate(-8deg);box-shadow:0 0 14px var(--mint);animation:ride 3.6s ease-in-out infinite alternate}
@keyframes ride{from{left:4%}to{left:96%}}
.route .km{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:700;white-space:nowrap}
.legs{display:grid;gap:10px;margin-top:12px}
.leg{padding:12px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.leg b{display:block;font-size:13px;margin-bottom:8px}
.cfg{margin-top:4px}
.tot{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:8px;margin-top:12px}
.tot div{padding:10px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.tot .all{background:radial-gradient(100% 80% at 50% 120%,rgba(255,181,71,.3),transparent 70%),rgba(255,181,71,.06);border-color:rgba(255,181,71,.35)}
.tot span{display:block;font-size:11.5px;color:var(--mut)}
.tot b{display:block;font-family:"Bricolage Grotesque";font-size:18px;font-weight:800}
.tot .all b{color:var(--amber)}
.tot small{font-size:11px;color:var(--dim)}
.tl{position:relative;margin-top:10px}
.tl::before{content:"";position:absolute;left:19px;top:12px;bottom:12px;width:2px;background:linear-gradient(var(--cyan),var(--mint));opacity:.35;border-radius:2px}
.tl-row{display:grid;grid-template-columns:40px 1fr;gap:10px;padding:8px 0;position:relative}
.tl-ic{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-size:19px;position:relative;z-index:1;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.3),transparent 60%),color-mix(in srgb,var(--k) 22%,#10153f);border:1px solid color-mix(in srgb,var(--k) 45%,transparent);box-shadow:0 6px 14px -6px var(--k)}
.tl-row.stop .tl-ic{width:32px;height:32px;margin-left:4px;font-size:15px;border-radius:50%}
.tl-row.stop .tl-b{align-self:center;font-size:13px;color:var(--mut)}
.tl-row.stop strong{font-weight:600;color:var(--k)}
.tl-h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.tl-h strong{font-size:14px;font-weight:600;line-height:1.3}
.tl-sub{font-size:12px;color:var(--mut);line-height:1.4}
.tl-cost{flex:none;border:1px dashed var(--line2);background:rgba(255,255,255,.04);color:var(--txt);font:inherit;font-weight:700;font-size:13px;padding:4px 9px;border-radius:10px;cursor:pointer;font-variant-numeric:tabular-nums}
.tl-cost.user{border-style:solid;border-color:rgba(61,255,197,.5);color:var(--mint)}
.sim.anim .tl-row,.pick.anim .tl-row{animation:rkin .5s cubic-bezier(.16,.9,.24,1) backwards}
.cfg-l{font-size:12px;font-weight:700;color:var(--cyan);margin:14px 0 6px}
.cfg-in{margin-top:6px}
.cp{font-size:11px;opacity:.7}
/* SOS e nav */
.sosb{border:0;border-radius:99px;padding:7px 13px;font:inherit;font-weight:800;font-size:13px;letter-spacing:.04em;color:#fff;cursor:pointer;
  background:linear-gradient(160deg,#ff5b7f,#e0244f);box-shadow:0 0 0 3px rgba(255,77,141,.18),0 6px 16px -4px #ff4d8d;animation:sosPulse 2.4s ease-in-out infinite}
@keyframes sosPulse{50%{box-shadow:0 0 0 6px rgba(255,77,141,.1),0 6px 20px -2px #ff4d8d}}
.nav .fab{flex:0 0 auto;margin-top:-24px;width:62px;height:62px;border-radius:20px;justify-content:center;color:#06102a!important;
  background:linear-gradient(150deg,var(--mint),#22c9a0);box-shadow:0 0 0 4px rgba(61,255,197,.15),0 10px 24px -6px var(--mint)}
.nav .fab svg{width:26px;height:26px;color:#06102a!important}
.nav .fab span{font-size:10px;font-weight:700}
.nav .fab.on{background:linear-gradient(150deg,#fff,var(--mint))}
body.sosmode{background:radial-gradient(70% 40% at 50% 0%,rgba(255,77,141,.28),transparent 70%),var(--ink)}
.sos-hero{padding:22px 18px;border-radius:26px;text-align:center;background:radial-gradient(100% 80% at 50% 120%,rgba(255,77,141,.45),transparent 70%),linear-gradient(165deg,#3a1236,#1a0d2c);
  border:1px solid rgba(255,77,141,.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 3px 0 #4a1640,0 6px 0 #2a0c27,0 30px 50px -20px rgba(255,77,141,.5)}
.sos-lead{color:#ffb3c7;font-size:13px;font-weight:600}
.sos-big{display:flex;flex-direction:column;align-items:center;gap:4px;margin:12px auto 14px;padding:22px 14px;border-radius:24px;text-decoration:none;color:#fff;
  background:linear-gradient(160deg,#ff5b7f,#d81b47);box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 4px 0 #9e1235,0 8px 0 #6e0c25,0 24px 40px -10px #ff4d8d;transition:transform .1s}
.sos-big:active{transform:translateY(5px);box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 2px 0 #9e1235,0 12px 24px -10px #ff4d8d}
.sos-big span{font-size:40px;line-height:1}.sos-big b{font-family:"Bricolage Grotesque";font-size:24px;font-weight:800}.sos-big em{font-style:normal;font-family:"Bricolage Grotesque";font-size:44px;font-weight:800;letter-spacing:.06em}
.sos-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.sos-card{padding:16px;border-radius:20px;margin-bottom:12px;background:radial-gradient(90% 60% at 50% 125%,color-mix(in srgb,var(--k) 28%,transparent),transparent 70%),linear-gradient(165deg,#1a2158,#0e1339);
  border:1px solid color-mix(in srgb,var(--k) 40%,transparent);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 3px 0 #141a52,0 6px 0 #0a0e33,0 20px 30px -14px rgba(0,0,0,.9)}
.sos-who{display:flex;gap:12px;align-items:center}
.sos-who>div{flex:1;min-width:0}.sos-who strong{display:block;font-size:16px}.sos-who>div span{display:block;font-size:13px;color:var(--mut)}
.sos-av{width:44px;height:44px;flex:none;border-radius:14px;display:grid;place-items:center;font-family:"Bricolage Grotesque";font-weight:800;font-size:20px;color:#06102a;background:var(--k);box-shadow:0 0 16px -4px var(--k)}
.sos-acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.sos-acts .btn{flex:1;text-align:center;padding:12px}
.sos-file .sos-f{padding:9px 0;border-bottom:1px solid var(--line)}.sos-file .sos-f:last-child{border-bottom:0}
.sos-f span{display:block;font-size:12px;color:var(--amber);font-weight:600}.sos-f b{display:block;font-weight:500;font-size:14px;margin-top:3px;line-height:1.45}
/* formulário */
.f-start{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.f-big{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:18px 14px;border-radius:22px;cursor:pointer;color:var(--txt);font:inherit;
  background:radial-gradient(90% 60% at 50% 125%,color-mix(in srgb,var(--k) 35%,transparent),transparent 70%),linear-gradient(165deg,#1a2158,#0e1339);border:1px solid color-mix(in srgb,var(--k) 45%,transparent);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 3px 0 #141a52,0 6px 0 #0a0e33,0 22px 30px -14px rgba(0,0,0,.9);animation:capin .5s cubic-bezier(.2,1.5,.4,1) backwards;animation-delay:calc(var(--i)*80ms);transition:transform .12s}
.f-big:active{transform:translateY(4px)}

<script>
/* ====================== PARÂMETROS ====================== */
const KEY = 'dose_pwa_v1';
const DB_VERSION = 2;
const LATE_HOURS_DAILY = 2;       // dose diária vira atrasada depois de 2 h
const LATE_DAYS_INTERVAL = 1;     // dose espaçada vira atrasada depois de 1 dia
const BUY_ALERT_DAYS = 10;        // avisar compra quando faltar isso
const PICKUP_ALERT_DAYS = 10;     // perguntar onde vai estar quando faltar isso
const CITIES = ['São Carlos','São Paulo'];
const COLORS = ['var(--mint)','var(--cyan)','var(--lav)','var(--pink)','var(--amber)'];
const FORMS = ['comprimido','cápsula','seringa','caneta','spray','colírio','pomada','frasco','adesivo','sachê','gota','ml','ampola','unidade'];

const GROUPS = {continuo:'Contínuos',sos:'SOS',outros:'Outros'};
const SUS_DEFAULT = {
  unit:'Farmácia de Alto Custo de São Carlos', city:'São Carlos',
  address:'Rua Padre Teixeira, 3756 — Centro', hours:'', phone:''
};
const PICKUP_DOCS = [
  'Documento com foto e CPF do paciente',
  'Cartão Nacional de Saúde (carteirinha do SUS)',
  'Carteirinha da farmácia de alto custo, se a unidade usar',
  'Recibo ou protocolo da última retirada',
];
const COLD_DOC = 'Caixa térmica com gelo reciclável (remédio de geladeira)';
const REP_DOCS = ['Declaração de autorização assinada pela paciente','Documento com foto e CPF de quem vai retirar'];
const RENEW_DOCS = [
  'Novo LME preenchido pelo médico (vale 90 dias para entregar)',
  'Receita médica atualizada',
  'Exames exigidos pelo protocolo do remédio',
  'Documento com foto e CPF',
  'Comprovante de residência com CEP',
];

/* ====================== DATAS E TEXTO ====================== */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const isoT=d=>`${iso(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const parse=s=>{const [y,m,d]=s.slice(0,10).split('-').map(Number);const x=new Date(y,m-1,d);if(s.length>10){const [h,mi]=s.slice(11,16).split(':').map(Number);x.setHours(h,mi)}return x};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const addMonths=(d,n)=>{const x=new Date(d);x.setMonth(x.getMonth()+n);return x};
const today=()=>{const t=new Date();t.setHours(0,0,0,0);return t};
const dd=(a,b)=>Math.round((parse(iso(a))-parse(iso(b)))/864e5);
const fD=d=>d.toLocaleDateString('pt-BR',{day:'numeric',month:'short'}).replace('.','');
const fDW=d=>d.toLocaleDateString('pt-BR',{weekday:'short',day:'numeric',month:'short'}).replace(/\./g,'');
const rel=d=>{const n=dd(d,today());if(n===0)return'hoje';if(n===1)return'amanhã';if(n===-1)return'ontem';if(n>1&&n<7)return`em ${n} dias`;if(n<0)return`há ${-n} dias`;return fDW(d)};
const relD=d=>{const n=dd(d,today());return n>=0&&n<7?`${rel(d)}, ${fD(d)}`:fDW(d)};
const brl=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const plural=(n,s,p)=>`${n} ${n===1?s:(p||s+'s')}`;
const unit=(m,n)=>{const f=m.form; if(n===1||f==='ml')return f; return f.endsWith('ão')?f.replace(/ão$/,'ões'):f+'s'};

/* ====================== DADOS REAIS (lista de 2 nov 2026) ====================== */
const PK=(...a)=>a.map(x=>{const [l,z]=x.split('/').map(Number);return{left:l,size:z}});
const FULL=(n,z)=>Array(n).fill(`${z}/${z}`);
const REF=(v,src,pack)=>({value:v,source:src,date:'2026-11-02',pack});
function susBlank(cold){return {...SUS_DEFAULT,cycleDays:28,perPickup:1,lmeStart:null,lmeMonths:6,nextPickup:null,available:false,availableSince:null,pickups:[],call:null,
  docs:[...PICKUP_DOCS,...(cold?[COLD_DOC]:[])].map(t=>({t,on:false})),rep:{allowed:true,name:(S&&S.profile&&S.profile.helper)||''},renewDocs:RENEW_DOCS.map(t=>({t,on:false}))}}
function M(o){return Object.assign({id:uid(),strength:'',form:'comprimido',dose:1,color:'var(--cyan)',sched:null,packs:[],stock:0,level:null,unknown:false,
  cold:false,source:'compra',group:'continuo',rx:false,purchases:[],ref:null,notes:''},o)}
function seed(){
  return {profile:{patient:'',helper:'',home:'São Carlos'},where:{city:null,from:null,to:null},example:false,log:[],appts:[],meds:[]};
}
let S; try{S=JSON.parse(localStorage.getItem(KEY))||seed()}catch(e){S=seed()}
function normMed(m){
  m=Object.assign(M({}),m);
  if(m.group==='sempre')m.group='sos';if(m.group==='casa')m.group='outros';if(!GROUPS[m.group])m.group='outros';
  if(!Array.isArray(m.packs))m.packs=[];if(!Array.isArray(m.purchases))m.purchases=[];
  if(m.source==='sus'||m.sus)m.sus=Object.assign(susBlank(m.cold),m.sus||{});
  if(m.sus&&!Array.isArray(m.sus.docs))m.sus.docs=susBlank(m.cold).docs;
  if(m.sus&&!Array.isArray(m.sus.renewDocs))m.sus.renewDocs=susBlank(m.cold).renewDocs;
  if(m.sus&&!Array.isArray(m.sus.pickups))m.sus.pickups=[];
  if(m.sus&&!m.sus.rep)m.sus.rep={allowed:true,name:''};
  return m;
}

const packSize=m=>m.packs&&m.packs.length?Math.max(...m.packs.map(p=>p.size)):0;
const boxUnits=m=>parseInt((m.ref&&m.ref.pack)||'')||m.boxSize||packSize(m)||30;
function takeUnits(m,n){
  if(m.level)return;
  if(!m.packs||!m.packs.length){m.stock=Math.max(0,(m.stock||0)-n);return}
  let r=n;
  while(r>0){const open=m.packs.filter(p=>p.left>0).sort((a,b)=>a.left-b.left)[0];if(!open)break;const k=Math.min(open.left,r);open.left-=k;r-=k}
  m.packs=m.packs.filter(p=>p.left>0);
}
function addUnits(m,n){
  if(m.level)return;
  if(!m.packs||!m.packs.length){if(m.source==='sus'||!packSize(m)){m.stock=(m.stock||0)+n;return}}
  const notFull=m.packs.filter(p=>p.left<p.size).sort((a,b)=>b.left-a.left)[0];
  if(notFull&&notFull.left+n<=notFull.size){notFull.left+=n;return}
  m.packs.push({left:n,size:Math.max(n,packSize(m))});
}
function addBox(m,units){
  if(m.level){m.level='cheio';return}
  const ps=packSize(m)||units;let r=units;
  while(r>0){const n=Math.min(ps,r);m.packs.push({left:n,size:ps});r-=n}
  m.unknown=false;
}
function buyStatus(m){
  if(m.source==='sus')return'ok';
  if(m.level)return m.level==='vazio'?'out':m.level==='acabando'?'low':'ok';
  if(m.unknown&&!qty(m))return'check';
  const q=qty(m);if(q<=0)return'out';
  if(m.group==='outros'&&m.kind!=='pele')return'ok';
  if(m.sched)return stockInfo(m).daysLeft<=BUY_ALERT_DAYS?'low':'ok';
  const fr=forecast(m);if(fr&&fr.real)return dd(fr.real.end,today())<=BUY_ALERT_DAYS?'low':'ok';
  const ps=packSize(m)||1;
  if(m.group==='sos')return (q/m.dose<=3||q/ps<=.3)?'low':'ok';
  return (q<.5*ps||q<=7)?'low':'ok';
}

}

}

function schedText(m){
  const s=m.sched,q=`${m.dose} ${unit(m,m.dose)}`;
  if(s.type==='daily') return `${q}, ${s.times.length===1?'todo dia às '+s.times[0]:s.times.length+' vezes ao dia ('+s.times.join(', ')+')'}`;
  if(s.every===7) return `${q}, uma vez por semana às ${s.time}`;
  return `${q} a cada ${s.every} dias, às ${s.time}`;
}
const lastTaken=m=>S.log.filter(l=>l.medId===m.id&&l.taken).sort((a,b)=>b.taken.localeCompare(a.taken))[0];
function nextInterval(m){ // conta a partir da última aplicação real
  const lt=lastTaken(m);
  const base=lt?parse(lt.taken.slice(0,10)):addDays(parse(m.sched.start),-m.sched.every);
  let d=addDays(base,m.sched.every);const dl=m.sched.delay;if(dl&&dl.to&&dl.from===iso(d))d=parse(dl.to);
  const [h,mi]=m.sched.time.split(':').map(Number); d.setHours(h,mi); return d;
}
function plannedInterval(m){const lt=lastTaken(m);const base=lt?parse(lt.taken.slice(0,10)):addDays(parse(m.sched.start),-m.sched.every);return addDays(base,m.sched.every)}
const delayOn=m=>{const dl=m.sched&&m.sched.delay;return dl&&dl.to&&dl.from===iso(plannedInterval(m))?dl:null};
const DELAY_WHY=['Atraso do alto custo','Orientação médica','Outro motivo'];

    <div class="fld"><label>Nova data</label><div class="tags" style="margin-bottom:8px">${chip('+3 dias',iso(addDays(P,3)))}${chip('+7 dias',iso(addDays(P,7)))}${chip('+14 dias',iso(addDays(P,14)))}${exp&&parse(exp)>P?chip(`Quando o lote chega (${fD(parse(exp))})`,exp):''}</div>

    <button class="btn fill block" style="--k:var(--amber)" onclick="saveDelay('${id}')">Adiar para ${fD(parse(D.to))}</button>
    ${dl?`<button class="btn block quiet" style="margin-top:8px" onclick="undoDelay('${id}')">Voltar para a data original (${fD(P)})</button>`:''}`);

function saveDelay(id){
  const m=med(id),D=UI.dly,P=iso(plannedInterval(m));if(!D||D.to<=P){toast('Escolha uma data depois da prevista');return}
  m.sched.delay={from:P,to:D.to,why:D.why,note:D.note,at:iso(today())};
  m.delays=(m.delays||[]).filter(x=>x.from!==P).concat({from:P,to:D.to,days:dd(parse(D.to),parse(P)),why:D.why,note:D.note});
  UI.dly=null;save();closeSheet();render();toast(`Aplicação de ${m.name} adiada para ${fD(parse(D.to))}`);
}
function undoDelay(id){const m=med(id),P=iso(plannedInterval(m));delete m.sched.delay;m.delays=(m.delays||[]).filter(x=>x.from!==P);UI.dly=null;save();closeSheet();render();toast('Data original de volta')}
function delayBlock(m){

    <button class="btn sm" style="--k:var(--amber)" onclick="UI.dly=null;delaySheet('${m.id}')">${dl?'Mudar':'Adiar'}</button></div>`;
}
function dueToday(){
  const now=new Date(),T=iso(today()),out=[];
  scheduled().forEach(m=>{
    if(m.sched.type==='daily'){
      m.sched.times.forEach(t=>{
        const sched=`${T}T${t}`, e=S.log.find(l=>l.medId===m.id&&l.sched===sched), sd=parse(sched);
        const h=(now-sd)/36e5, late=!e&&h>LATE_HOURS_DAILY;
        out.push({m,sched,sd,e,late,lateTxt:late?`${Math.floor(h)} h de atraso`:''});
      });
    }else{
      const nd=nextInterval(m),diff=dd(today(),nd);
      if(diff>=0) out.push({m,sched:isoT(nd),sd:nd,e:null,late:diff>=LATE_DAYS_INTERVAL,lateTxt:diff>=LATE_DAYS_INTERVAL?`${plural(diff,'dia')} de atraso`:'',interval:true});
      const lt=lastTaken(m); if(lt&&lt.taken.slice(0,10)===T) out.push({m,sched:lt.sched,sd:parse(lt.sched),e:lt,interval:true});
    }
  });
  return out.sort((a,b)=>a.sd-b.sd);
}
/* cartela: últimas doses + a próxima */
function capsules(m){
  const n=m.sched.type==='daily'?Math.min(7,7*m.sched.times.length):5;
  const past=S.log.filter(l=>l.medId===m.id).sort((a,b)=>a.sched.localeCompare(b.sched));
  const pend=dueToday().filter(x=>x.m.id===m.id&&!x.e).map(x=>({status:x.late?'over':'due'}));
  if(!pend.length&&m.sched.type==='interval') pend.push({status:'due'});
  if(!pend.length&&m.sched.type==='daily') pend.push({status:'due'});
  return [...past.slice(-(n-pend.length)).map(l=>({status:l.status,l})),...pend];
}
function stockInfo(m){
  let end;
  const st0=qty(m);
  if(m.sched.type==='daily') end=addDays(today(),Math.floor(st0/(m.dose*m.sched.times.length))-1);
  else{const nd=nextInterval(m),k=Math.floor(st0/m.dose); end=k>0?addDays(nd,(k-1)*m.sched.every):addDays(nd,-1)}
  const gap=m.sched.type==='daily'?1:m.sched.every;
  const firstMissing=m.sched.type==='daily'?addDays(end,1):(Math.floor(st0/m.dose)>0?addDays(end,gap):nextInterval(m));
  return {end,firstMissing,daysLeft:Math.max(0,dd(firstMissing,today()))};
}
function priceInfo(m){
  const P=(m.purchases||[]).slice().sort((a,b)=>a.date.localeCompare(b.date));
  const last=P.at(-1), recent=P.slice(-3);
  const est=recent.length?recent.reduce((a,p)=>a+p.price,0)/recent.length:(m.ref?m.ref.value:0);
  /* estimativa por caixa */
  const spent=P.filter(p=>dd(today(),parse(p.date))<=180).reduce((a,p)=>a+p.price*p.boxes,0);
  return {last,est,spent,n:P.length};
}
function lmeInfo(m){
  const s=m.sus,start=parse(s.lmeStart),end=addDays(addMonths(start,s.lmeMonths),-1);
  const idx=(today().getFullYear()-start.getFullYear())*12+today().getMonth()-start.getMonth()+1;
  const toEnd=dd(end,today());
  return {end,idx:Math.max(1,idx),renew:idx>=s.lmeMonths||toEnd<=35,expired:toEnd<0};
}
function adherence(id,days=30){
  const from=iso(addDays(today(),-days));
  const L=S.log.filter(l=>(id==='all'||l.medId===id)&&l.sched>=from);
  const ok=L.filter(l=>l.status==='ok').length,late=L.filter(l=>l.status==='late').length,miss=L.filter(l=>l.status==='miss'||l.status==='skip').length,none=L.filter(l=>l.status==='auto').length;
  return {total:L.length,ok,late,miss,none,pct:L.length?Math.round(ok/L.length*100):100};
}
/* onde a família vai estar */
const away=()=>S.where.city && S.where.city!==S.profile.home;
function awayOn(date){
  if(!away())return false;
  const f=S.where.from?parse(S.where.from):today(), t=S.where.to?parse(S.where.to):null;
  return date>=f && (!t||date<=t);
}
function dosesDuring(m,from,to){ // aplicações espaçadas que caem num intervalo
  if(m.sched.type!=='interval'||!to)return [];
  const out=[];let d=nextInterval(m);
  while(d<=to){if(d>=from)out.push(new Date(d));d=addDays(d,m.sched.every)}
  return out;
}

function statusFor(m,sched,taken){
  if(!taken)return'miss';
  const h=(parse(taken)-parse(sched))/36e5;
  return m.sched.type==='daily'?(h>LATE_HOURS_DAILY?'late':'ok'):(h/24>=LATE_DAYS_INTERVAL?'late':'ok');
}
function nextSite(m){
  const last=S.log.filter(l=>l.medId===m.id&&l.site&&l.site!=='Não informado').sort((a,b)=>b.sched.localeCompare(a.sched))[0];
  if(!last)return null;
  const flip=last.site.includes('direit')?last.site.replace('direito','esquerdo').replace('direita','esquerda'):last.site.replace('esquerdo','direito').replace('esquerda','direita');
  return {last:last.site,next:flip};
}

function burst(r,big){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cx=r?r.left+r.width/2:innerWidth/2,cy=r?r.top+r.height/2:innerHeight/2;
  const cols=['#3dffc5','#45d2ff','#b39bff','#ff4d8d','#ffb547'],n=big?46:16;
  for(let i=0;i<n;i++){const el=document.createElement('i');el.className='fx';
    const a=Math.random()*Math.PI*2,d=(big?140:70)+Math.random()*(big?220:90);
    el.style.left=cx+'px';el.style.top=cy+'px';el.style.setProperty('--c',cols[i%5]);
    el.style.setProperty('--dx',Math.cos(a)*d+'px');el.style.setProperty('--dy',Math.sin(a)*d-(big?60:30)+'px');
    el.style.setProperty('--rot',(Math.random()*720-360)+'deg');el.style.setProperty('--t',(700+Math.random()*(big?900:400))+'ms');
    document.body.appendChild(el);setTimeout(()=>el.remove(),1800)}
}

function recordTake(medId,sched,taken,site,units){
  const r=tapRect;
  const m=med(medId),status=statusFor(m,sched,taken);
  const prev=S.log.find(l=>l.medId===medId&&l.sched===sched);
  S.log=S.log.filter(l=>!(l.medId===medId&&l.sched===sched));
  const lid=prev?prev.id:uid(),oldT=S.appts.find(a=>a.id==='tk-'+lid),u=+units||(oldT?oldT.units:m.dose);
  S.log.push({id:lid,medId,sched,taken,status,...(site?{site}:{})});
  if(taken&&!(prev&&prev.taken))takeUnits(m,u);
  else if(taken&&oldT&&u!==oldT.units){if(u>oldT.units)takeUnits(m,u-oldT.units);else addUnits(m,oldT.units-u)}
  if(!taken&&prev&&prev.taken)addUnits(m,oldT?oldT.units:m.dose);
  if(taken)addTake(medId,u,taken,lid);else dropTake('tk-'+lid);
  UI.just=S.log.at(-1).id;
  save();render();
  if(!taken){toast(`Anotado: ${m.name} ficou sem tomar. Amanhã a gente acerta.`);return}
  burst(r,false);
  const d=dueToday();
  if(d.length&&d.every(x=>x.e))setTimeout(party,250);
  else toast(status==='late'?`Registrado. Antes tarde do que nunca: ${m.name}`:`${CHEERS[Math.floor(Math.random()*CHEERS.length)]} ${m.name} registrado`);
}

/* ====================== RECEITAS ====================== */
function rxInfo(m){
  if(!m.rx||!m.rxDate)return null;
  const end=addDays(parse(m.rxDate),(+m.rxDays||30)-1),left=dd(end,today());
  return {end,left,expired:left<0};
}
function rxNeeds(){ // remédios controlados que vão precisar de receita nova
  return S.meds.filter(m=>m.rx&&m.source!=='sus').filter(m=>{const r=rxInfo(m);return !r||r.left<=45});
}
function rxNotices(A){
  S.meds.filter(m=>m.rx&&m.source!=='sus').forEach(m=>{
    const r=rxInfo(m),need=['low','out'].includes(buyStatus(m));
    if(!r){if(need)A.push({pri:58,h:`Tem receita para comprar ${esc(m.name)}?`,p:'É controlado: a farmácia retém a receita. Informe a data da receita para o app avisar quando vencer.',acts:[['Informar a receita',`medSheet('${m.id}')`],['Marcar consulta',`apptSheet(null,{title:'Consulta para receita'})`]]});return}
    if(r.expired&&need)A.push({pri:72,h:`Receita de ${esc(m.name)} venceu em ${fD(r.end)}`,p:'Sem receita nova não dá para comprar. Peça na próxima consulta ou ligue para o médico.',acts:[['Marcar consulta',`apptSheet(null,{title:'Consulta para receita'})`],['Já tenho nova',`medSheet('${m.id}')`]]});
    else if(!r.expired&&r.left<=7)A.push({pri:need?66:42,h:`Receita de ${esc(m.name)} vence ${r.left===0?'hoje':`em ${plural(r.left,'dia')}`}`,p:need?'O estoque está acabando: compre antes de a receita vencer.':'Se for comprar este mês, compre antes do vencimento.',acts:[['Ver remédio',`medSheet('${m.id}')`]]});
  });
}
function rxFields(d){
  if(!d.rx)return'';
  const r=d.rxDate?addDays(parse(d.rxDate),(+d.rxDays||30)-1):null;
  return `<div class="two"><div class="fld"><label>Data da receita</label><input type="date" value="${d.rxDate||''}" oninput="md.rxDate=this.value||null"></div>
    <div class="fld"><label>Vale por (dias)</label><input type="number" min="1" value="${d.rxDays||30}" oninput="md.rxDays=+this.value"></div></div>
    <p class="help" style="margin:-4px 0 12px">Receita de controle especial costuma valer 30 dias a partir da data. Antibiótico, 10 dias. ${r?`Esta vale até <b>${fD(r)}</b>.`:''}</p>`;
}

/* ====================== RELATÓRIO PARA A CONSULTA ====================== */
function reportData(days){
  const from=addDays(today(),-days+1),fi=iso(from);
  const meds=S.meds.filter(m=>m.sched||m.group==='continuo'),sosUsed=S.meds.filter(m=>m.group==='sos').map(m=>m.name);
  const rows=meds.map(m=>{const L=S.log.filter(l=>l.medId===m.id&&l.sched>=fi),ok=L.filter(l=>l.status==='ok').length,late=L.filter(l=>l.status==='late').length,miss=L.filter(l=>l.status==='miss'||l.status==='auto').length,skip=L.filter(l=>l.status==='skip').length;
    return {m,how:m.sched?schedText(m):'quando precisa',ok,late,miss,skip,n:L.length}});
  const D=diary().filter(e=>e.date>=fi),moods=D.filter(e=>e.mood),pains=D.filter(e=>e.pain!=null);
  const freq={};D.forEach(e=>e.sx.forEach(s=>freq[s]=(freq[s]||0)+1));
  const sx=Object.entries(freq).sort((a,b)=>b[1]-a[1]);
  const exams=AP().filter(a=>a.kind==='exame'&&parse(a.date)<=today()).sort((a,b)=>b.date.localeCompare(a.date));
  const seen=new Set(),lastEx=exams.filter(a=>{const k=slug(a.title);if(seen.has(k))return false;seen.add(k);return true}).slice(0,10);
  const nx=AP().filter(a=>parse(a.date)>=today()&&a.kind!=='exame').sort((a,b)=>a.date.localeCompare(b.date))[0];
  const ask=nx?nx.bring.filter(b=>!b.on&&!/^Relatório do Dose/.test(b.t)).map(b=>b.t):[];
  const rx=rxNeeds().map(m=>`Receita de ${m.name} ${m.strength||''}`.trim());
  const lme=S.meds.filter(m=>m.source==='sus'&&m.sus&&m.sus.lmeStart&&lmeInfo(m).renew).map(m=>`Novo LME e receita de ${m.name}`);
  const delays=S.meds.flatMap(m=>(m.delays||[]).filter(x=>x.from>=fi).map(x=>({...x,name:m.name})));
  return {from,days,rows,sosUsed,delays,D,moodAvg:moods.length?moods.reduce((a,e)=>a+e.mood,0)/moods.length:null,painAvg:pains.length?pains.reduce((a,e)=>a+e.pain,0)/pains.length:null,painMax:pains.length?Math.max(...pains.map(e=>e.pain)):null,sx,lastEx,nx,ask:[...new Set([...ask,...rx,...lme])],notes:D.filter(e=>e.note&&e.note.trim())};
}

  <h2>Exames recentes</h2>${r.lastEx.length?`<table><tr><th>Exame</th><th>Data</th><th>Resultado</th></tr>${r.lastEx.map(a=>`<tr><td>${esc(a.title)}</td><td>${parse(a.date).toLocaleDateString('pt-BR')}</td><td>${esc(a.result||'—')}</td></tr>`).join('')}</table>`:'<p class="muted">Nenhum exame registrado.</p>'}
  ${r.ask.length?`<h2>Para pedir ou perguntar</h2><ul>${r.ask.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`:''}
  ${r.nx&&r.nx.notes?`<h2>Anotações para a consulta</h2><p>${esc(r.nx.notes)}</p>`:''}`;
}
function printReport(){
  let p=document.getElementById('print');if(!p){p=document.createElement('div');p.id='print';document.body.appendChild(p)}

function reportText(r){
  const L=[`Relatório — ${patient()}`,`${fD(r.from)} a ${fD(today())}`,'','REMÉDIOS'];
  r.rows.forEach(x=>L.push(`• ${x.m.name} ${x.m.strength||''}: ${x.how}${x.n?` — ${x.ok}/${x.n} no horário, ${x.late} com atraso, ${x.miss} não tomadas`:''}`));

/* ====================== MODO VIAGEM ====================== */
function travelCalc(from,to,margin){
  const days=Math.max(1,dd(to,from)+1),out=[];
  scheduled().forEach(m=>{
    let doses;
    if(m.sched.type==='daily'){doses=(days+margin)*m.sched.times.length}
    else{doses=dosesDuring(m,from,addDays(to,margin)).length}
    const need=doses*m.dose;if(!need&&m.sched.type==='interval')return;
    const has=m.level?null:qty(m);
    out.push({m,need,has,short:has!=null&&has<need?need-has:0});
  });
  const sos=S.meds.filter(m=>m.group==='sos');
  return {days,out,sos,cold:out.filter(x=>x.m.cold)};
}

  UI.trip??={from:S.where.from&&S.where.city!==S.profile.home?S.where.from:iso(today()),to:S.where.to||iso(addDays(today(),6)),margin:2,got:{}};
  const T=UI.trip,from=parse(T.from),to=parse(T.to<T.from?T.from:T.to),r=travelCalc(from,to,T.margin);
  openSheet(`<h2>Mala de remédios</h2><div class="hint">${plural(r.days,'dia')} fora${S.where.city&&S.where.city!==S.profile.home?` em ${esc(S.where.city)}`:''}, com ${plural(T.margin,'dia')} de folga se a volta atrasar.</div>
    <div class="two"><div class="fld"><label>Saída</label><input type="date" value="${T.from}" onchange="UI.trip.from=this.value;travelSheet()"></div><div class="fld"><label>Volta</label><input type="date" value="${T.to}" onchange="UI.trip.to=this.value;travelSheet()"></div></div>
    <div class="fld"><label>Folga</label><div class="seg">${[0,1,2,3,5].map(n=>`<button class="${T.margin===n?'on':''}" onclick="UI.trip.margin=${n};travelSheet()">${n?`+${n} dias`:'sem folga'}</button>`).join('')}</div></div>
    <div class="list">${r.out.map(x=>`<div class="pack" style="--k:${x.m.color}" onclick="UI.trip.got['${x.m.id}']=!UI.trip.got['${x.m.id}'];travelSheet()"><b class="num">${Math.ceil(x.need)}</b>
      <div style="flex:1"><strong>${esc(x.m.name)} ${esc(x.m.strength||'')}</strong><br><span class="help">${unit(x.m,Math.ceil(x.need))}${x.m.cold?' · na caixa térmica':''}${x.short?` · <b style="color:var(--pink)">faltam ${Math.ceil(x.short)}, compre antes</b>`:x.has!=null?` · tem ${x.has} em casa`:''}</span></div>

let tessP=null;
function loadTess(){return tessP||(tessP=new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';s.onload=()=>ok(window.Tesseract);s.onerror=()=>{tessP=null;no(new Error('load'))};document.head.appendChild(s)}))}
function camPick(){const i=document.createElement('input');i.type='file';i.accept='image/*';i.capture='environment';i.onchange=()=>{if(i.files[0])ocrBox(i.files[0])};i.click()}
const OCR_SKIP=new Set('comprimidos comprimido revestidos revestido capsulas capsula caps uso oral adulto adultos pediatrico venda sob prescricao medica medicamento generico similar referencia contem cada embalagem caixa lote validade fabricacao farmaceutico responsavel industria brasileira laboratorio exija nota fiscal atencao gramas solucao suspensao gotas injetavel liberacao prolongada blister registro ms anvisa sac www com br'.split(' '));
function ocrParse(txt){
  const t=txt.replace(/\r/g,''),flat=t.replace(/\s+/g,' ');
  const strengths=[...new Set((flat.match(/\d+(?:[.,]\d+)?\s?(?:mg|mcg|µg|g|ml|mL|UI|%)(?:\s?\/\s?(?:ml|mL|g))?/gi)||[]).map(s=>s.replace(/\s+/g,' ').replace(/ML/,'ml')))].slice(0,4);
  const cnt=(flat.match(/(\d{1,3})\s*(?:comprimidos|comp\.?|cápsulas|capsulas|cáps|caps|drágeas|sachês)/i)||[])[1];
  const words={};t.split(/\n/).forEach((line,li)=>line.split(/[^A-Za-zÀ-ÿ]+/).forEach(w=>{const n=slug(w);if(w.length<4||OCR_SKIP.has(n))return;const score=(w===w.toUpperCase()?3:1)+(w.length>6?1:0)+Math.max(0,3-li*.3);words[w[0].toUpperCase()+w.slice(1).toLowerCase()]=(words[w[0].toUpperCase()+w.slice(1).toLowerCase()]||0)+score}));
  const names=Object.entries(words).sort((a,b)=>b[1]-a[1]).map(x=>x[0]).slice(0,6);
  return {names,strengths,cnt:cnt?+cnt:null};
}
async function ocrBox(file){
  openSheet(`<h2>Lendo a caixa…</h2><div class="hint" id="ocrS">Carregando o leitor (só na primeira vez demora um pouco).</div>`);
  try{
    const T=await loadTess();
    const r=await T.recognize(file,'por',{logger:m=>{const e=document.getElementById('ocrS');if(e&&m.status==='recognizing text')e.textContent=`Lendo… ${Math.round(m.progress*100)}%`}});
    const p=ocrParse(r.data.text||'');UI.ocr=p;ocrPick();
  }catch(e){openSheet(`<h2>Não consegui ler</h2><div class="hint">Confira a internet (o leitor baixa na primeira vez) e tente de novo, com a caixa bem iluminada e o nome ocupando a foto.</div><button class="btn fill block" onclick="camPick()">Tirar outra foto</button><button class="btn block quiet" style="margin-top:8px" onclick="drawMed()">Voltar</button>`)}
}
function ocrPick(){
  const p=UI.ocr;
  openSheet(`<h2>O que achei na caixa</h2><div class="hint">Toque no que estiver certo. Dá para corrigir depois.</div>
    <div class="fld"><label>Nome</label><div class="tags">${p.names.map(n=>`<button class="${md.name===n?'on':''}" style="--k:var(--mint)" onclick="md.name='${n.replace(/'/g,'')}';ocrPick()">${esc(n)}</button>`).join('')||'<span class="help">Não achei um nome claro.</span>'}</div></div>
    <div class="fld"><label>Concentração</label><div class="tags">${p.strengths.map(s=>`<button class="${md.strength===s?'on':''}" style="--k:var(--cyan)" onclick="md.strength='${s}';ocrPick()">${esc(s)}</button>`).join('')||'<span class="help">Não achei.</span>'}</div></div>
    ${p.cnt?`<div class="fld"><label>Unidades na caixa</label><div class="tags"><button class="${md.packs.some(x=>x.size===p.cnt)?'on':''}" style="--k:var(--lav)" onclick="if(!md.packs.some(x=>x.size===${p.cnt})){md.packs.push({left:${p.cnt},size:${p.cnt}});md.unknown=false;md._mode='packs'}ocrPick()">Caixa com ${p.cnt}</button></div></div>`:''}
    <button class="btn fill block" onclick="drawMed()">Continuar o cadastro</button>
    <button class="btn block quiet" style="margin-top:8px" onclick="camPick()">Tirar outra foto</button>`);

const fmtU=u=>String(u).replace('.',',');
function addTake(medId,units,at,logId){
  const id=logId?'tk-'+logId:'tk-'+uid(),r={id,rec:'take',medId,at,units,...(logId?{logId}:{})};
  const i=S.appts.findIndex(a=>a.id===id);if(i>=0)S.appts[i]=r;else S.appts.push(r);return r;

const dropTake=id=>{S.appts=S.appts.filter(a=>a.id!==id)};
function takeNow(id,units,at){
  const m=med(id);units=+units;if(!(units>0)){toast('Informe a quantidade');return}
  at=at||isoT(new Date());const when=parse(at);
  const pend=m.sched?dueToday().filter(x=>x.m.id===id&&!x.e).sort((a,b)=>Math.abs(a.sd-when)-Math.abs(b.sd-when)):[];

  const r=tapRect;addTake(id,units,at);takeUnits(m,units);save();render();burst(r,false);
  toast(`${m.level?'Uso':fmtU(units)+' '+unit(m,units)} de ${m.name} registrado${m.level?'':`. Restam ${qty(m)}`}`);

  if(t.logId){const l=S.log.find(x=>x.id===t.logId);if(l){undo(l.id);return}}
  if(m)addUnits(m,t.units);dropTake(tid);save();render();toast('Tomada desfeita, voltou para o estoque');

/* previsão: pelo tratamento x pelo que está sendo tomado */
function useRate(m,days=14){
  const from=iso(addDays(today(),-days+1)),T=takes(m.id).filter(t=>t.at>=from);
  if(!T.length)return null;
  const first=parse(T.at(-1).at),age=dd(today(),first)+1;
  const span=Math.min(days,Math.max(age,1)),u=T.reduce((a,t)=>a+t.units,0);
  return {perDay:u/span,units:u,span,n:T.length,ready:age>=3};
}
const planRate=m=>!m.sched?null:m.sched.type==='daily'?m.dose*m.sched.times.length:m.dose/m.sched.every;
function forecast(m){
  if(m.level)return null;
  const q=qty(m),r=useRate(m),p=planRate(m);
  const plan=m.sched&&p?{end:stockInfo(m).firstMissing,perDay:p}:null;
  const real=r&&r.ready&&r.perDay>0?{end:addDays(today(),Math.floor(q/r.perDay)),perDay:r.perDay,span:r.span}:null;
  return {plan,real,r,q};
}
const perDayTxt=(m,v)=>v>=1?`${fmtU(+v.toFixed(1))} ${unit(m,v)} por dia`:`1 a cada ${fmtU(+(1/v).toFixed(1))} dias`;

/* ====================== CALENDÁRIO ====================== */
function evRange(from,to){ // tudo que acontece entre duas datas, por dia
  const E={},put=(d,e)=>{const k=typeof d==='string'?d.slice(0,10):iso(d);if(k<iso(from)||k>iso(to))return;(E[k]=E[k]||[]).push(e)};
  const T=iso(today());
  scheduled().forEach(m=>{
    if(m.sched.type==='interval'){
      S.log.filter(l=>l.medId===m.id&&l.taken).forEach(l=>put(l.taken,{ic:'💉',k:m.color,t:`${m.name}: ${injectable(m)?'aplicada':'tomada'}`,sub:l.site||`às ${l.taken.slice(11,16)}`,pri:2}));
      const dl=delayOn(m);if(dl)put(dl.from,{ic:'🕒',k:'var(--amber)',t:`${m.name}: aplicação adiada`,sub:`para ${fD(parse(dl.to))}, ${dl.why.toLowerCase()}`,pri:4,act:`UI.dly=null;delaySheet('${m.id}')`});
      let d=nextInterval(m);const toEnd=addDays(parse(iso(to)),1);for(let i=0;i<40&&d<toEnd;i++){if(d>=from&&iso(d)>=T)put(d,{ic:'💉',k:m.color,t:`${m.name}: ${injectable(m)?'aplicação':'dose'}`,sub:`às ${m.sched.time}${qty(m)<m.dose?' — sem remédio em casa':''}`,pri:qty(m)<m.dose?5:3,...(iso(d)===T?{act:`closeSheet();go('hoje')`}:{})});d=addDays(d,m.sched.every)}
    }
  });
  for(let d=new Date(from);d<=to;d=addDays(d,1)){
    const k=iso(d),daily=scheduled().filter(m=>m.sched.type==='daily'&&(!m.sched.start||m.sched.start<=k)&&!(m.until&&m.until<k));
    if(!daily.length)continue;
    const tot=daily.reduce((a,m)=>a+m.sched.times.length,0);
    if(k<=T){const L=S.log.filter(l=>l.sched.slice(0,10)===k&&daily.some(m=>m.id===l.medId)),ok=L.filter(l=>l.taken).length;
      if(L.length||k===T)put(k,{ic:'💊',k:ok===tot?'var(--mint)':ok?'var(--amber)':'var(--mut)',t:`Doses do dia: ${ok} de ${tot} registradas`,sub:L.filter(l=>l.status==='auto').length?'algumas fecharam sem registro':'',pri:1,dose:ok/tot,act:k===T?`closeSheet();go('hoje')`:`closeSheet();go('historico')`})}
  }
  S.meds.forEach(m=>{

async function joinHouse(){

function doImport(){
  let d;try{d=JSON.parse(imT.value)}catch(e){toast('Isso não parece o texto copiado do app');return}
  if(!d||!Array.isArray(d.meds)){toast('Não achei remédios nesse texto');return}
  const byId=(a,b)=>{const m=new Map(a.map(x=>[x.id,x]));b.forEach(x=>m.set(x.id,x));return [...m.values()]};
  S.meds=byId(S.meds,d.meds);S.log=byId(S.log,d.log||[]);S.appts=byId(S.appts,d.appts||[]);
  ['profile','plan','where','sim','apptFrom','sos','contacts'].forEach(k=>{if(d[k])S[k]=d[k]});
  normalize();save();closeSheet();UI.anim=true;render();toast(`Importado: ${d.meds.length} remédios e ${(d.log||[]).length} registros`);
}
async function boot(){
  if(!window.supabase){processAuto();render();setSync('off');toast('Sem conexão com o servidor: usando os dados deste aparelho.');return}
  sb=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  const {data}=await sb.auth.getSession();SESSION=data.session;
  sb.auth.onAuthStateChange((ev,ses)=>{SESSION=ses});
  if(!SESSION){gateEmail();return}
  processAuto();render();await afterLogin();
}

/* ====================== CONTAGEM AUTOMÁTICA ====================== */
const autoOn=m=>m.sched&&m.sched.type==='daily'&&m.autoCount!==false&&!injectable(m)&&!m.level;
function processAuto(){
  const T=iso(today());let n=0;
  scheduled().forEach(m=>{
    if(!autoOn(m))return;
    if(!m.autoFrom){m.autoFrom=T;n++;return}
    let d=parse(m.autoFrom);const st=m.sched.start?parse(m.sched.start):d;if(d<st)d=st;
    if(m.until&&parse(m.until)<addDays(today(),-1)){}
    while(iso(d)<T){
      const ds=iso(d);
      if(!(m.until&&ds>m.until))m.sched.times.forEach(t=>{const sched=`${ds}T${t}`;
        if(!S.log.some(l=>l.medId===m.id&&l.sched===sched)){S.log.push({id:`a_${m.id}_${ds.replace(/-/g,'')}${t.replace(':','')}`,medId:m.id,sched,taken:null,status:'auto'});n++}});
      d=addDays(d,1);
    }
    if(m.autoFrom!==T){m.autoFrom=T;n++}
  });
  if(n){localSave();schedulePush()}
}
function skipSheet(dateIso){
  const d=dateIso||iso(addDays(today(),-1));
  const meds=scheduled().filter(m=>m.sched.type==='daily');
  openSheet(`<h2>Pular um dia</h2>
    <div class="hint">Use quando ela não tomou num dia (dormiu, esqueceu, passou mal). As doses daquele dia voltam para o estoque e ficam marcadas como puladas.</div>
    <div class="fld"><label>Qual dia</label><input type="date" id="skD" value="${d}" max="${iso(today())}" onchange="skipSheet(this.value)"></div>
    <div class="row" style="margin:-4px 0 12px;gap:6px"><button class="btn sm quiet" onclick="skipSheet('${iso(today())}')">Hoje</button><button class="btn sm quiet" onclick="skipSheet('${iso(addDays(today(),-1))}')">Ontem</button><button class="btn sm quiet" onclick="skipSheet('${iso(addDays(today(),-2))}')">Anteontem</button></div>
    <div class="fld"><label>Quais remédios</label>${meds.length?meds.map(m=>{const n=m.sched.times.length;const done=S.log.filter(l=>l.medId===m.id&&l.sched.slice(0,10)===d&&l.status==='skip').length;
      return `<div class="chk ${done?'':'on'}" data-id="${m.id}" onclick="this.classList.toggle('on')"><span class="bx"></span><span>${esc(m.name)} ${esc(m.strength)}<br><small style="color:var(--mut)">${plural(n,'dose')} de ${plural(m.dose*n,unit(m,1),unit(m,2))}${done?', já pulado':''}</small></span></div>`}).join(''):'<p class="help">Nenhum remédio com horário diário.</p>'}</div>
    <button class="btn fill block" style="--k:var(--amber)" onclick="doSkip()">Pular e devolver ao estoque</button>`);
}
function doSkip(){
  const d=skD.value,ids=[...document.querySelectorAll('.sheet .chk.on')].map(e=>e.dataset.id);let back=0,cnt=0;
  ids.forEach(id=>{const m=med(id);if(!m||!m.sched)return;
    m.sched.times.forEach(t=>{const sched=`${d}T${t}`;const l=S.log.find(x=>x.medId===id&&x.sched===sched);
      if(l){if(l.status==='skip'||l.status==='miss')return;if(l.taken){addUnits(m,m.dose);back+=m.dose}l.status='skip';l.taken=null;cnt++}
      else{S.log.push({id:`s_${id}_${d.replace(/-/g,'')}${t.replace(':','')}`,medId:id,sched,taken:null,status:'skip'});cnt++}});
  });
  save();closeSheet();render();toast(cnt?`${plural(cnt,'dose')} pulada${cnt>1?'s':''}${back?`, ${back} de volta ao estoque`:''}`:'Nada para pular nesse dia');
}
