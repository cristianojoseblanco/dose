function F(){return UI.form}
function fSteps(c){return F_STEPS[c.type].filter(st=>!st.show||st.show(c.data))}
function fStart(type,edit){
  const d={};F_STEPS[type].forEach(st=>{if(st.def!==undefined)d[st.k]=typeof st.def==='function'?st.def():st.def});
  if(type==='trat'){d.extras={auto:true};d.packs=[]}
  if(type==='sos')d.packs=[];
  if(type==='appt')d.bring=[];
  F().cur={type,data:edit?JSON.parse(JSON.stringify(edit.data)):d,i:0,edit:edit?edit.idx:null,medId:edit&&edit.medId||null};F().view='step';F().dir=1;render();
}
function fVal(){const c=F().cur,st=fSteps(c)[c.i];return c.data[st.k]}
function fSet(v,adv){const c=F().cur,st=fSteps(c)[c.i];c.data[st.k]=v;const el=document.getElementById('fIn');if(el)el.value=v;if(adv)fNext();else render()}
function fNext(){
  const c=F().cur,L=fSteps(c),st=L[c.i];
  const el=document.getElementById('fIn');if(el&&['text','chips','number','money','date','time'].includes(st.type))c.data[st.k]=el.value.trim();
  const v=c.data[st.k];
  if(st.req&&(v==null||v===''||(Array.isArray(v)&&!v.length))){toast('Preencha para continuar');return}
  if(c.i<fSteps(c).length-1){c.i++;F().dir=1;render();return}
  const item={type:c.type,data:c.data,medId:c.medId};
  if(c.edit!=null)F().cart[c.edit]=item;else F().cart.push(item);
  F().cur=null;F().view='added';render();
}
function fBack(){const c=F().cur;if(c.i>0){c.i--;F().dir=-1;render()}else{F().cur=null;F().view=F().cart.length?'review':'start';render()}}
function packsOf(d){return (d.packs||[]).filter(p=>p.size>0)}
function fSummary(it){
  const d=it.data,u=n=>{const f=d.form||'unidade';return n==1?f:f==='ml'?f:f+'s'};
  if(it.type==='appt')return `${d.kind==='exame'?'Exame':'Consulta'}: ${d.title}${d.who?`, ${d.who}`:''}. ${d.date?fDW(parse(d.date)):''}${d.time?` às ${d.time}`:''}${d.city?`, ${d.city}`:''}`;
  if(it.type==='pele')return `${d.skin||'Pele'}: ${d.name}. ${({am:'De manhã',pm:'À noite',both:'Manhã e noite',free:'Só às vezes'})[d.when]||''}, embalagem ${({cheio:'cheia',metade:'pela metade',acabando:'acabando',vazio:'vazia'})[d.level]||''}`;
  const P=packsOf(d),q=P.reduce((a,p)=>a+(+p.left||0),0);
  const fr=d.freq==='daily'?`${d.dose} ${u(d.dose)} às ${(d.times||[]).join(', ')}`:d.freq==='interval'?`${d.dose} ${u(d.dose)} a cada ${d.every} dias`:it.type==='sos'?(d.cat==='sos'?'SOS, quando precisar':'Guardado em casa'):'Quando precisar';
  const est=d.source==='sus'?`${d.stock||0} em casa, retirado no SUS`:P.length?`${q} em casa (${P.map(p=>`${p.left}/${p.size}`).join(' + ')})`:'nada em casa';
  return `${d.name}${d.strength?' '+d.strength:''}. ${fr}. ${est}${d.price?`, R$ ${(+d.price).toFixed(2).replace('.',',')}`:''}`;
}
function fToObjects(it){
  const d=it.data,T=iso(today());
  if(it.type==='appt')return {appt:{id:uid(),title:d.title,who:d.who||'',date:d.date,time:d.time||'',place:d.place||'',city:d.city||'',kind:d.kind||'consulta',renewLme:d.renew==='yes',
    bring:[...(d.bring||[]),...(d.renew==='yes'?['Pedir novo LME','Pedir receita atualizada']:[])].map(t=>({t,on:false})),notes:''}};
  const base=it.medId?med(it.medId):null;
  const m=base?JSON.parse(JSON.stringify(base)):M({color:COLORS[S.meds.length%COLORS.length]});
  m.name=d.name;m.strength=d.strength||'';
  if(it.type==='pele'){
    m.kind='pele';m.form=/protetor|hidrat|sabonete|tônico|sérum|ácido/i.test(d.skin||'')?'frasco':'pomada';m.notes=d.skin||'';m.level=d.level||'cheio';m.packs=[];m.dose=1;m.autoCount=false;m.color='#ffb547';
    const tm=d.when==='am'?['07:00']:d.when==='pm'?['21:00']:d.when==='both'?['07:00','21:00']:null;
    m.sched=tm?{type:'daily',times:tm,start:T}:null;m.group=tm?'continuo':'outros';
  }else{
    m.form=d.form||'comprimido';m.dose=+d.dose||1;m.kind=null;
    if(it.type==='sos'){m.group=d.cat==='outros'?'outros':'sos';m.sched=null;m.notes=d.notes||m.notes||''}
    else{
      m.group='continuo';
      m.sched=d.freq==='daily'?{type:'daily',times:(d.times||[]).slice().sort(),start:d.start||T}:d.freq==='interval'?{type:'interval',every:+d.every||14,time:d.time||'09:00',start:d.start||T}:null;
      m.until=d.dur==='until'?d.until:d.dur==='days'&&d.start?iso(addDays(parse(d.start),(+d.days||1)-1)):null;
      const ex=d.extras||{};m.rx=yes(ex.rx);m.cold=yes(ex.cold);m.autoCount=yes(ex.auto);if(!base||!m.autoFrom)m.autoFrom=T;
      m.source=d.source||'compra';
      if(m.source==='sus'){m.packs=[];m.stock=+d.stock||0;m.sus=Object.assign(susBlank(m.cold),m.sus||{})}
    }
    if(m.source!=='sus'){m.packs=packsOf(d).map(p=>({left:+p.left||0,size:+p.size||1}))}
    if(['seringa','caneta'].includes(m.form))m.autoCount=false;
  }
  m.unknown=false;
  if(d.price&&+d.price>0&&!base)m.purchases=[{date:T,boxes:1,price:+d.price,store:''}];
  return {med:m};
}
function fSaveAll(){
  let nm=0,na=0;
  F().cart.forEach(it=>{const o=fToObjects(it);if(o.appt){S.appts.push(o.appt);na++}else{const i=S.meds.findIndex(x=>x.id===o.med.id);if(i>=0)S.meds[i]=o.med;else S.meds.push(o.med);nm++}});
  F().cart=[];F().view='start';save();burst(null,true);
  toast(`Salvo! ${nm?plural(nm,'item','itens')+' em Remédios':''}${nm&&na?' e ':''}${na?plural(na,'consulta'):''}`);
  UI.view=nm?'remedios':'consultas';UI.anim=true;scrollTo({top:0});render();
}
function medToForm(m){
  const d={name:m.name,strength:m.strength,form:m.form,dose:String(m.dose),packs:JSON.parse(JSON.stringify(m.packs||[])),price:''};
  if(m.kind==='pele'){const t=m.sched?m.sched.times:[];return {type:'pele',data:{name:m.name,skin:m.notes||'Outro',when:t.length===2?'both':t[0]==='07:00'?'am':t[0]?'pm':'free',level:m.level||'cheio'}}}
  if(m.group!=='continuo')return {type:'sos',data:{...d,cat:m.group,notes:m.notes}};
  Object.assign(d,{freq:m.sched?m.sched.type:'none',times:m.sched&&m.sched.times?m.sched.times.slice():[],every:m.sched&&m.sched.every?String(m.sched.every):'14',time:m.sched&&m.sched.time||'09:00',
    start:m.sched&&m.sched.start||iso(today()),dur:m.until?'until':'cont',until:m.until||'',source:m.source,stock:String(m.stock||0),extras:{rx:!!m.rx,cold:!!m.cold,auto:m.autoCount!==false}});
  return {type:'trat',data:d};
}
function editWithForm(id){const m=med(id),f=medToForm(m);closeSheet();UI.view='form';F().cart=[];fStart(f.type,{data:f.data,idx:null,medId:id});}

function fInput(st,c){
  const v=c.data[st.k];
  if(st.type==='text')return `<input id="fIn" class="f-in" value="${esc(v||'')}" placeholder="${esc(st.ph||'')}" onkeydown="if(event.key==='Enter')fNext()" autocomplete="off">`;
  if(st.type==='chips'||st.type==='number'||st.type==='money'){
    const isN=st.type!=='chips';
    return `<input id="fIn" class="f-in" ${isN?`type="number" inputmode="decimal" step="${st.type==='money'?'0.01':'0.5'}"`:''} value="${esc(v||'')}" placeholder="${esc(st.ph||(st.type==='money'?'R$ 0,00':''))}" onkeydown="if(event.key==='Enter')fNext()">
      ${st.unitOf?`<p class="help" style="margin-top:6px">${unit({form:c.data.form||'comprimido'},2)}</p>`:''}
      ${st.opts?`<div class="f-chips">${st.opts.map(o=>`<button class="f-chip ${String(v)===o?'on':''}" onclick="fSet('${o}',true)">${st.unitOf?`${o.replace('0.5','½')} ${unit({form:c.data.form||'comprimido'},o==='1'||o==='0.5'?1:2)}`:o}</button>`).join('')}</div>`:''}`;
  }
  if(st.type==='date')return `<input id="fIn" class="f-in" type="date" value="${esc(v||'')}">
    <div class="f-chips"><button class="f-chip" onclick="fSet('${iso(today())}',true)">Hoje</button><button class="f-chip" onclick="fSet('${iso(addDays(today(),1))}',true)">Amanhã</button><button class="f-chip" onclick="fSet('${iso(addDays(today(),7))}',true)">Daqui a 1 semana</button></div>`;
  if(st.type==='time')return `<input id="fIn" class="f-in" type="time" value="${esc(v||'')}">
    <div class="f-chips">${['07:00','08:00','09:00','12:00','20:00','22:00'].map(t=>`<button class="f-chip" onclick="fSet('${t}',true)">${t}</button>`).join('')}</div>`;
  if(st.type==='choice')return `<div class="f-opts">${st.opts.map(([val,l])=>`<button class="f-opt ${v===val?'on':''}" onclick="fSet('${val}',true)">${l}</button>`).join('')}</div>`;
  if(st.type==='times'){const sel=v||[];return `<div class="f-chips">${[...new Set([...TIMES,...sel])].sort().map(t=>`<button class="f-chip ${sel.includes(t)?'on':''}" onclick="fToggleTime('${t}')">${t}</button>`).join('')}</div>
    <div class="addline" style="margin-top:12px"><input type="time" id="fT" style="flex:1"><button class="btn sm" onclick="if(fT.value)fToggleTime(fT.value,true)">Outro horário</button></div>
    <p class="help" style="margin-top:8px">${sel.length?`${plural(sel.length,'vez','vezes')} ao dia: ${sel.slice().sort().join(', ')}`:'Toque em todos os horários.'}</p>`}
  if(st.type==='packs'){const P=v||[];return `${P.map((p,i)=>`<div class="pkrow"><span>Cartela/caixa ${i+1}: restam</span><input type="number" min="0" value="${p.left}" onchange="F().cur.data.packs[${i}].left=+this.value"><span>de</span><input type="number" min="1" value="${p.size}" onchange="F().cur.data.packs[${i}].size=+this.value"><button class="x" onclick="F().cur.data.packs.splice(${i},1);render()">×</button></div>`).join('')}
    <p class="help" style="margin:6px 0 8px">Toque para adicionar uma caixa ou cartela:</p>
    <div class="f-chips">${[10,14,15,20,28,30,60].map(n=>`<button class="f-chip" onclick="F().cur.data.packs.push({left:${n},size:${n}});render()">+ ${n} un.</button>`).join('')}</div>
    <p class="help" style="margin-top:10px">${P.length?`Total: ${P.reduce((a,p)=>a+(+p.left||0),0)} unidades. Ajuste "restam" se alguma já está aberta.`:'Se não tem nenhum agora, só toque em Próximo.'}</p>`}
  if(st.type==='toggles'){const o=v||{};return st.opts.filter(x=>!x[2]||x[2](c.data)).map(([key,l])=>`<div class="tgrow">${l}<button class="tg ${o[key]?'on':''}" onclick="F().cur.data.extras=Object.assign({},F().cur.data.extras,{${key}:!${!!o[key]}});render()"></button></div>`).join('')}
  if(st.type==='multi'){const sel=v||[];return `<div class="f-chips">${[...new Set([...st.opts,...sel])].map(o=>`<button class="f-chip ${sel.includes(o)?'on':''}" onclick="fToggleMulti(this.textContent)">${esc(o)}</button>`).join('')}</div>
    <div class="addline" style="margin-top:12px"><input id="fM" placeholder="Outro item" onkeydown="if(event.key==='Enter'&&this.value.trim())fToggleMulti(this.value.trim())"><button class="btn sm" onclick="if(fM.value.trim())fToggleMulti(fM.value.trim())">Adicionar</button></div>`}
  return '';
}
function fToggleTime(t,force){const c=F().cur;c.data.times=c.data.times||[];const i=c.data.times.indexOf(t);if(i>=0&&!force)c.data.times.splice(i,1);else if(i<0)c.data.times.push(t);render()}
function fToggleMulti(t){const c=F().cur;c.data.bring=c.data.bring||[];const i=c.data.bring.indexOf(t);if(i>=0)c.data.bring.splice(i,1);else c.data.bring.push(t);render()}
function vForm(){
  const f=F();
  if(f.view==='step'&&f.cur){
    const c=f.cur,L=fSteps(c),st=L[c.i],T=FORM_TYPES[c.type],auto=st.type==='choice';
    return `${header()}
    <div class="f-top"><button class="link" onclick="fBack()">‹ Voltar</button><span>${T.ic} ${T.t}${c.medId?' (editando)':''}</span><span class="num">${c.i+1}/${L.length}</span></div>
    <div class="f-prog"><i style="width:${(c.i+1)/L.length*100}%"></i></div>
    <div class="f-card ${f.dir<0?'back':''}" style="--k:${T.k}" key="${c.i}">
      <h2 class="f-q">${st.q}</h2>${st.hint?`<p class="help" style="margin-bottom:12px">${st.hint}</p>`:''}
      ${fInput(st,c)}
      ${auto?'':`<button class="btn fill block" style="--k:${T.k};margin-top:18px" onclick="fNext()">${c.i===L.length-1?'Concluir':'Próximo'}</button>`}
      ${!st.req&&auto?`<button class="btn block quiet" style="margin-top:12px" onclick="fNext()">Pular</button>`:''}
    </div>
    ${f.cart.length?`<p class="help" style="text-align:center;margin-top:14px">${plural(f.cart.length,'item','itens')} esperando confirmação</p>`:''}`;
  }
  if(f.view==='added'){
    const last=f.cart[f.cart.length-1],T=FORM_TYPES[last.type];
    return `${header()}<div class="f-card" style="--k:${T.k};text-align:center">
      <div class="f-ok">✓</div><h2 class="f-q">Anotado!</h2><p class="lede">${esc(fSummary(last))}</p>
      <button class="btn fill block" style="--k:var(--mint);margin-top:18px" onclick="F().view='start';render()">Adicionar outra coisa</button>
      <button class="btn block" style="--k:var(--cyan);margin-top:8px" onclick="F().view='review';render()">Revisar e salvar (${f.cart.length})</button></div>`;
  }
  if(f.view==='review'){
    return `${header()}<h1 style="font-size:28px">Confirme antes de salvar</h1><p class="lede">Confira o que vai entrar no app. Toque em Editar para corrigir.</p>
      <div style="height:14px"></div>
      ${f.cart.length?f.cart.map((it,i)=>{const T=FORM_TYPES[it.type];return `<div class="f-item" style="--k:${T.k}"><span class="f-ic">${T.ic}</span><div><b>${T.t}${it.medId?' (atualização)':''}</b><p>${esc(fSummary(it))}</p>
        <div class="row" style="margin-top:8px;gap:6px"><button class="btn sm" style="--k:${T.k}" onclick="F().cur={type:'${it.type}',data:JSON.parse(JSON.stringify(F().cart[${i}].data)),i:0,edit:${i},medId:${it.medId?`'${it.medId}'`:'null'}};F().view='step';render()">Editar</button><button class="btn sm quiet" onclick="F().cart.splice(${i},1);render()">Remover</button></div></div></div>`}).join('')
        :'<div class="empty">Nada para salvar.</div>'}
      ${f.cart.length?`<button class="btn fill block" style="margin-top:16px" onclick="fSaveAll()">Salvar tudo no app</button>`:''}
      <button class="btn block quiet" style="margin-top:8px" onclick="F().view='start';render()">Adicionar mais</button>`;
  }
  return `${header()}<h1 style="font-size:30px">O que você quer adicionar?</h1><p class="lede">Uma pergunta por vez. No fim você confere tudo antes de salvar.</p>
    <div class="f-start">${Object.entries(FORM_TYPES).map(([k,T],i)=>`<button class="f-big" style="--k:${T.k};--i:${i}" onclick="fStart('${k}')"><span class="f-ic">${T.ic}</span><b>${T.t}</b><small>${T.sub}</small></button>`).join('')}</div>
    ${f.cart.length?`<button class="btn fill block" style="--k:var(--cyan);margin-top:16px" onclick="F().view='review';render()">Revisar e salvar (${f.cart.length})</button>`:''}
    <p class="help" style="margin-top:16px">Para mudar algo que já existe, abra o remédio em Remédios e toque em "Editar passo a passo".</p>`;
}
function render(){
  const V={hoje:vHoje,remedios:vRemedios,retiradas:vRetiradas,consultas:vConsultas,historico:vHistorico,urgencia:vUrgencia,form:vForm,calendario:vCalendario};
  document.getElementById('app').innerHTML=V[UI.view]();
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===UI.view));
  document.body.classList.toggle('sosmode',UI.view==='urgencia');
  wire();
  const kb=document.getElementById('kits');if(kb){kb.addEventListener('scroll',()=>requestAnimationFrame(kitTick),{passive:true});kitTick()}
}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.v));
boot();
</script>
</body>
</html>
